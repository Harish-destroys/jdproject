# ==========================================
# SecondServe Spring Boot Configuration
# ==========================================
server.port=8080

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/secondserve_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
secondserve.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
